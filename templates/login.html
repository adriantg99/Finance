<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Finance</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="login-body">
  <form class="login-card" method="post" autocomplete="on">
    <h1>📈 Finance</h1>
    <p class="muted">Tu panel de inversiones. Escribe la contraseña que pusiste en el archivo <code>.env</code> (variable <code>FINANCE_PASSWORD</code>).</p>
    {% if error %}<div class="alert alert-bad">{{ error }}</div>{% endif %}
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" required autofocus autocomplete="current-password">
    <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    <p class="tiny muted">La sesión se recuerda 30 días en este navegador. Usa "Salir" en equipos ajenos.</p>
  </form>
</body>
</html>
